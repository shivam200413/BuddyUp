name: activity_buddy
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Core Icons
  cupertino_icons: ^1.0.8
  
  # Backend
  supabase_flutter: ^2.0.0
  
  # Maps & Location (Free)
  flutter_map: ^6.1.0       # The OpenStreetMap widget
  latlong2: ^0.9.0          # Helper for Coordinates
  geolocator: ^10.1.0       # GPS Location
  url_launcher: ^6.2.0      # For opening links (optional)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - .env